<script>
const firebaseConfig = {
    apiKey: "AIzaSyCBNML0EM1RL0EiUK5S5Fi27JU3niH0rTI",
    authDomain: "hoopfinder-16cfb.firebaseapp.com",
    projectId: "hoopfinder-16cfb",
    storageBucket: "hoopfinder-16cfb.firebasestorage.app",
    messagingSenderId: "965894675612",
    appId: "1:965894675612:web:226601b3e3bca26fb52159",
    measurementId: "G-4BTW498XNP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API_BASE_URL = "https://us-central1-hoopfinder-16cfb.cloudfunctions.net/api";

async function fetchWithAuth(url, options = {}) {
    const user = auth.currentUser;
    if (!user) throw new Error("User not authenticated");
    const token = await user.getIdToken();
    const headers = options.headers || {};
    headers['Authorization'] = `Bearer ${token}`;
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    return fetch(url, options);
}
</script>
</head>
<body class="min-h-screen flex flex-col">
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.4)] pointer-events-auto">
  <div class="h-16 px-margin-mobile flex items-center gap-md">
    <a href="javascript:history.back()" class="w-12 h-12 -ml-2 flex items-center justify-center text-on-surface">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <div class="flex items-center gap-sm flex-1">
      <img alt="HoopFinder Logo" class="h-6 w-auto object-contain" src="logosvg.svg">
      <span class="font-headline-md text-headline-md text-primary uppercase truncate">Report Court</span>
    </div>
  </div>
</header>
<main class="flex-grow w-full pt-16 pb-24 bg-background">
    <div class="flex flex-col w-full gap-md">
        <section class="px-margin-mobile flex flex-col gap-sm mt-md">
            <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Add Missing Court</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Drop a pin to publish a court with full stats to HoopFinder.</p>
        </section>
        <form id="add-court-form" onsubmit="submitCourt(event)" class="px-margin-mobile flex flex-col gap-lg">
            <div class="flex flex-col gap-xs">
                <label class="font-label-bold text-label-bold text-on-surface-variant flex justify-between items-center">
                    <span>LOCATION</span><span class="text-primary cursor-pointer hover:underline text-xs" onclick="geolocate()">Use Current</span>
                </label>
                <div class="relative w-full h-48 rounded-lg overflow-hidden shadow-md">
                    <div id="add-map" class="absolute inset-0 z-0"></div>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                        <img src="logosvg.svg" class="w-12 h-12 drop-shadow-xl transform -translate-y-1/2">
                    </div>
                </div>
                <div class="text-xs text-on-surface-variant font-label-sm mt-1">Coordinates: <span id="coord-display">...</span></div>
            </div>
            
            <div class="flex flex-col gap-xs">
                <label class="font-label-bold text-label-bold text-on-surface-variant">COURT NAME</label>
                <input id="court-name" required class="bg-surface-container-low text-on-surface font-body-lg px-md py-md rounded-lg border-b-2 border-secondary focus:border-primary outline-none transition-colors w-full" placeholder="e.g. Fairmount Park Hoops">
            </div>

            <div class="grid grid-cols-2 gap-md">
                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">RATING (1 - 5.0)</label>
                    <input id="court-rating" type="number" step="0.1" min="1.0" max="5.0" value="4.5" required class="bg-surface-container-low text-on-surface font-body-md px-md py-md rounded-lg border-b-2 border-secondary outline-none">
                </div>
                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">NUMBER OF COURTS</label>
                    <select id="court-count" class="bg-surface-container-low text-on-surface font-body-md px-md py-md rounded-lg border-b-2 border-secondary outline-none">
                        <option value="Half Court">Half Court</option>
                        <option value="1 Court" selected>1 Court</option>
                        <option value="2 Courts">2 Courts</option>
                        <option value="3 Courts">3 Courts</option>
                        <option value="4 Courts">4 Courts</option>
                        <option value="5 Courts">5 Courts</option>
                        <option value="6 Courts">6 Courts</option>
                        <option value="7 Courts">7 Courts</option>
                        <option value="8 Courts">8 Courts</option>
                        <option value="9 Courts">9 Courts</option>
                        <option value="10 Courts">10 Courts</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-md">
                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">RIM TYPE</label>
                    <select id="rim-type" class="bg-surface-container-low text-on-surface font-body-md px-md py-md rounded-lg border-b-2 border-secondary outline-none">
                        <option value="Single Rim">Single Rim</option>
                        <option value="Double Rim">Double Rim</option>
                    </select>
                </div>
                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">COURT CONDITION</label>
                    <select id="court-condition" class="bg-surface-container-low text-on-surface font-body-md px-md py-md rounded-lg border-b-2 border-secondary outline-none">
                        <option value="Pristine">Pristine</option>
                        <option value="Good" selected>Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Needs Repair">Needs Repair</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-md">
                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">COURT ACCESS</label>
                    <select id="court-access" class="bg-surface-container-low text-on-surface font-body-md px-md py-md rounded-lg border-b-2 border-secondary outline-none">
                        <option value="Free Public Access">Free Public Access</option>
                        <option value="Paid / Membership Required">Paid / Membership Required</option>
                    </select>
                </div>
                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">SURFACE TYPE</label>
                    <select id="surface-type" class="bg-surface-container-low text-on-surface font-body-md px-md py-md rounded-lg border-b-2 border-secondary outline-none">
                        <option value="Asphalt">Asphalt</option>
                        <option value="Concrete">Concrete</option>
                        <option value="Hardwood">Hardwood (Indoor)</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col gap-xs">
                <label class="font-label-bold text-label-bold text-on-surface-variant">LIGHTING</label>
                <select id="lighting-status" class="bg-surface-container-low text-on-surface font-body-md px-md py-md rounded-lg border-b-2 border-secondary outline-none">
                    <option value="Yes">Lit at Night</option>
                    <option value="No">No Lights</option>
                </select>
            </div>

            <div class="mt-md">
                <button type="submit" id="submit-btn" class="w-full bg-primary text-on-primary font-headline-md text-headline-md uppercase py-md rounded-lg shadow-[0_4px_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none transition-all flex justify-center items-center gap-sm">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">publish</span> Submit Court
                </button>
            </div>
        </form>
    </div>
</main>

<script>
auth.onAuthStateChanged((user) => {
    if (!user) {
        window.location.href = "./index.html"; 
    } else if (typeof onAuthReady === 'function') {
        onAuthReady(user);
    }
});

let map;
let currentCoords = [-75.1652, 39.9526];

function onAuthReady(user) {
    map = new maplibregl.Map({
        container: 'add-map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: currentCoords,
        zoom: 15
    });

    map.on('move', () => {
        const center = map.getCenter();
        currentCoords = [center.lng, center.lat];
        document.getElementById('coord-display').innerText = `${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}`;
    });
}

function geolocate() {
    if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            map.flyTo({center: [pos.coords.longitude, pos.coords.latitude], zoom: 16});
        });
    }
}

async function submitCourt(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = "Submitting...";

    try {
        const res = await fetchWithAuth(`${API_BASE_URL}/courts`, {
            method: 'POST',
            body: {
                courtName: document.getElementById('court-name').value.trim(),
                rating: document.getElementById('court-rating').value,
                courtCount: document.getElementById('court-count').value,
                rimType: document.getElementById('rim-type').value,
                condition: document.getElementById('court-condition').value,
                access: document.getElementById('court-access').value,
                surfaceType: document.getElementById('surface-type').value,
                lit: document.getElementById('lighting-status').value,
                coordinates: currentCoords
            }
        });

        if(!res.ok) throw new Error(`HTTP Error ${res.status}`);
        alert("Court published to HoopFinder Database successfully!");
        window.location.href = "index.html";
    } catch(err) {
        alert("Error adding court: " + err.message);
        btn.disabled = false;
        btn.innerText = "Submit Court";
    }
}
</script>
</body>
