        function getDistanceFromLatLonInMi(lat1, lon1, lat2, lon2) {
            var R = 3958.8;
            var dLat = deg2rad(lat2 - lat1);
            var dLon = deg2rad(lon2 - lon1);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
        function deg2rad(deg) {return deg * (Math.PI / 180);}
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return null;
        }

<body class="min-h-screen flex flex-col">
    <header
        class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.4)] pointer-events-auto">
        <div class="h-16 px-margin-mobile flex items-center gap-md"><a href="javascript:history.back()"
                class="w-12 h-12 -ml-2 flex items-center justify-center text-on-surface"><span
                    class="material-symbols-outlined">arrow_back</span></a>
            <div class="flex items-center gap-sm flex-1"><img alt="HoopSpot Logo" class="h-6 w-auto object-contain"
                    src="screen.png"><span
                    class="font-headline-md text-headline-md text-primary uppercase truncate">Report Court</span></div>
        </div>
    </header>
    <main class="flex-grow w-full pt-16 pb-24 bg-background">
        <div class="flex flex-col w-full gap-md">
            <section class="px-margin-mobile flex flex-col gap-sm mt-md">
                <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Add Missing Court</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Drop a pin to add a court to our local DB
                    (API pending).</p>
            </section>
            <section class="px-margin-mobile flex flex-col gap-lg">
                <div class="flex flex-col gap-xs">
                    <label
                        class="font-label-bold text-label-bold text-on-surface-variant flex justify-between items-center">
                        <span>LOCATION</span><span class="text-primary cursor-pointer hover:underline text-xs"
                            onclick="geolocate()">Use Current</span>
                    </label>
                    <div class="relative w-full h-48 rounded-lg overflow-hidden shadow-md">
                        <div id="add-map" class="absolute inset-0 z-0"></div>
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                            <img src="screen.png" class="w-12 h-12 drop-shadow-xl transform -translate-y-1/2">
                        </div>
                    </div>
                    <div class="text-xs text-on-surface-variant font-label-sm mt-1">Coordinates: <span
                            id="coord-display">...</span></div>
                </div>

                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">COURT NAME</label>
                    <input
                        class="bg-surface-container-low text-on-surface font-body-lg text-body-lg px-md py-md rounded-lg border-b-2 border-secondary focus:border-primary outline-none transition-colors w-full"
                        placeholder="e.g. Rucker Park">
                </div>

                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-label-bold text-on-surface-variant">SURFACE TYPE</label>
                    <select
                        class="appearance-none bg-surface-container-low text-on-surface font-body-lg px-md py-md rounded-lg border-b-2 border-secondary focus:border-primary outline-none transition-colors w-full">
                        <option value="asphalt">Asphalt</option>
                        <option value="concrete">Concrete</option>
                        <option value="wood">Hardwood (Indoor)</option>
                    </select>
                </div>
            </section>

            <div class="mt-xl px-margin-mobile pb-md">
                <button onclick="alert('In a full backend, this would POST to OSM or a local database.')"
                    class="w-full bg-primary text-on-primary font-headline-md text-headline-md uppercase py-md rounded-lg shadow-[0_4px_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-[0_0px_0_rgba(0,0,0,1)] transition-all flex justify-center items-center gap-sm">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">publish</span>

    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "./index.html";
            } else {
                console.log("Welcome, " + user.displayName);
                const userPhoto = document.getElementById('header-user-photo');
                if (userPhoto && user.photoURL) {
                    userPhoto.src = user.photoURL;
                }
                if (typeof onAuthReady === 'function') {
                    onAuthReady(user);
                }
            }
        });
    </script>

    <script>
        let map;
        function onAuthReady(user) {
            map = new maplibregl.Map({
                container: 'add-map',
                style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                center: [-75.1652, 39.9526],
                zoom: 15
            });

            map.on('move', () => {
                const center = map.getCenter();
                document.getElementById('coord-display').innerText = `${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}`;
            });
        }

        function geolocate() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    map.flyTo({center: [pos.coords.longitude, pos.coords.latitude], zoom: 16});
                });
            }
        }
    </script>
