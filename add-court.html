async function fetchWithAuth(url, options = {}) {
    const user = auth.currentUser;
    if (!user) throw new Error("User not authenticated");
    const token = await user.getIdToken();
    const headers = options.headers || {};
    headers['Authorization'] = `Bearer ${token}`;
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    return fetch(url, options);
}

function getDistanceFromLatLonInMi(lat1, lon1, lat2, lon2) {
    var R = 3958.8;
    var dLat = deg2rad(lat2 - lat1);
    var dLon = deg2rad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
function deg2rad(deg) { return deg * (Math.PI / 180); }
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
    return null;
}

<script>
    let map;
    let currentCoords = [-75.1652, 39.9526];

    function onAuthReady(user) {
        map = new maplibregl.Map({
            container: 'add-map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: currentCoords,
            zoom: 15
        });

        map.on('move', () => {
            const center = map.getCenter();
            currentCoords = [center.lng, center.lat];
            document.getElementById('coord-display').innerText = `${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}`;
        });
    }

    function compressImage(file, maxWidth = 1200, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(
                        (blob) => {
                            if (blob) {
                                resolve(blob);
                            } else {
                                reject(new Error('Canvas image compression failed'));
                            }
                        },
                        'image/jpeg',
                        quality
                    );
                };
                img.onerror = (err) => reject(err);
            };
            reader.onerror = (err) => reject(err);
        });
    }
    
    function geolocate() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                map.flyTo({center: [pos.coords.longitude, pos.coords.latitude], zoom: 16});
            });
        }
    }

    async function submitCourt(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const imageInput = document.getElementById('court-image');
        
        if (!imageInput.files || imageInput.files.length === 0) {
            alert("Please select a court photo before submitting.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Compressing & Uploading Photo...";

        try {
            const rawFile = imageInput.files[0];
            const compressedBlob = await compressImage(rawFile, 1200, 0.75);

            const fileName = `courts/${Date.now()}_${auth.currentUser.uid}.jpg`;
            const storageRef = firebase.storage().ref().child(fileName);
            const snapshot = await storageRef.put(compressedBlob, { contentType: 'image/jpeg' });
            const imageUrl = await snapshot.ref.getDownloadURL();

            btn.innerText = "Submitting Court Specs...";

            const res = await fetchWithAuth(`${API_BASE_URL}/courts`, {
                method: 'POST',
                body: {
                    courtName: document.getElementById('court-name').value.trim(),
                    rating: document.getElementById('court-rating').value,
                    courtCount: document.getElementById('court-count').value,
                    rimType: document.getElementById('rim-type').value,
                    condition: document.getElementById('court-condition').value,
                    access: document.getElementById('court-access').value,
                    surfaceType: document.getElementById('surface-type').value,
                    lit: document.getElementById('lighting-status').value,
                    coordinates: currentCoords,
                    imageUrl: imageUrl
                }
            });

            if(!res.ok) throw new Error(`HTTP Error ${res.status}`);
            alert("Court & photo published successfully to HoopFinder!");
            window.location.href = "index.html";
        } catch(err) {
            alert("Error adding court: " + err.message);
            btn.disabled = false;
            btn.innerText = "Submit Court";
        }
    }
</script>
