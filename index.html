<script>
const firebaseConfig = {
    apiKey: "AIzaSyCBNML0EM1RL0EiUK5S5Fi27JU3niH0rTI",
    authDomain: "hoopfinder-16cfb.firebaseapp.com",
    projectId: "hoopfinder-16cfb",
    storageBucket: "hoopfinder-16cfb.firebasestorage.app",
    messagingSenderId: "965894675612",
    appId: "1:965894675612:web:226601b3e3bca26fb52159",
    measurementId: "G-4BTW498XNP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API_BASE_URL = "https://us-central1-hoopfinder-16cfb.cloudfunctions.net/api";

async function fetchWithAuth(url, options = {}) {
    const user = auth.currentUser;
    if (!user) throw new Error("User not authenticated");
    const token = await user.getIdToken();
    const headers = options.headers || {};
    headers['Authorization'] = `Bearer ${token}`;
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    return fetch(url, options);
}

function getDistanceFromLatLonInMi(lat1, lon1, lat2, lon2) {
    var R = 3958.8;
    var dLat = deg2rad(lat2 - lat1);
    var dLon = deg2rad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
function deg2rad(deg) { return deg * (Math.PI / 180); }
</script>

<body class="min-h-screen flex flex-col overflow-hidden">
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe border-b border-surface-container-highest pointer-events-auto">
  <div class="h-16 px-margin-mobile flex items-center justify-between gap-md">
    <div class="flex items-center gap-sm">
      <img alt="HoopFinder Logo" class="h-8 w-auto object-contain" src="logosvg.svg">
      <span class="font-headline-md text-headline-md text-primary uppercase truncate">Home Map</span>
    </div>
    <a href="profile.html">
      <img id="header-user-photo" alt="Profile" class="w-10 h-10 rounded-full object-cover border border-outline-variant/30 bg-surface-container-highest" src="logosvg.svg">
    </a>
  </div>
</header>
<main class="flex-grow w-full relative h-full">
    <div id="map"></div>
    
    <!-- Working Search Bar & Filter Toggle -->
    <div class="fixed top-20 left-4 right-4 z-20 flex gap-2 pointer-events-none">
        <div class="flex-1 bg-surface-container/95 backdrop-blur-md rounded-xl p-3 flex items-center gap-3 border border-outline-variant/30 pointer-events-auto shadow-lg shadow-black/20">
            <span class="material-symbols-outlined text-primary">search</span>
            <input id="search-input" oninput="applyFilters()" class="bg-transparent border-none outline-none text-body-md text-on-surface w-full placeholder:text-on-surface-variant font-body-md" placeholder="Search courts by name or surface..." type="text">
        </div>
        <button onclick="openFilterModal()" class="bg-surface-container/95 backdrop-blur-md rounded-xl p-3 border border-outline-variant/30 text-on-surface flex items-center justify-center hover:bg-surface-container-high transition-colors pointer-events-auto shadow-lg shadow-black/20">
            <span class="material-symbols-outlined">tune</span>
        </button>
    </div>

    <!-- Floating Action Button -->
    <a id="add-court-fab" href="add-court.html" class="fixed right-4 bottom-32 z-30 bg-primary w-14 h-14 rounded-full flex items-center justify-center text-on-primary hover:bg-primary/90 transition-transform duration-300 pointer-events-auto shadow-lg shadow-black/40">
        <span class="material-symbols-outlined text-3xl">add</span>
    </a>

    <!-- Collapsible Bottom Sheet -->
    <div id="bottom-sheet" class="fixed bottom-16 left-0 w-full z-40 bg-surface/95 backdrop-blur-xl border-t border-surface-container-highest transition-transform duration-300 ease-out translate-y-[calc(100%-3.5rem)] rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] flex flex-col pointer-events-auto">
        <div id="sheet-header" class="w-full h-14 flex items-center justify-center cursor-pointer relative touch-none shrink-0">
            <div class="w-12 h-1.5 bg-outline-variant rounded-full absolute top-2 opacity-50"></div>
            <div class="w-full px-4 flex justify-between items-center absolute bottom-2">
                <h2 class="font-headline-md text-headline-md text-on-background uppercase tracking-tight flex items-center gap-2">
                    <span id="sheet-icon" class="material-symbols-outlined text-on-surface-variant transition-transform duration-300">expand_less</span> Courts Near You
                </h2>
                <span onclick="event.stopPropagation(); fetchCourts()" class="font-label-sm text-primary uppercase cursor-pointer hover:underline z-10 px-2 py-1">Refresh</span>
            </div>
        </div>

        <div id="courts-list" class="flex overflow-x-auto gap-4 px-4 pb-6 pt-2 snap-x snap-mandatory scrollbar-hide grow">
            <div class="p-4 text-on-surface-variant flex items-center gap-2 font-label-bold text-label-bold"><span class="material-symbols-outlined animate-spin text-primary">sync</span> Loading courts...</div>
        </div>
    </div>

    <!-- Filter Settings Modal -->
    <div id="filter-modal" class="fixed inset-0 z-[100] bg-background/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="w-full max-w-md bg-surface-container border border-surface-container-highest rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl flex flex-col gap-md">
            <div class="flex justify-between items-center border-b border-surface-container-highest pb-3">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">tune</span>
                    <h3 class="font-headline-md text-headline-md text-on-background uppercase">Filter Courts</h3>
                </div>
                <button onclick="closeFilterModal()" class="text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined">close</span></button>
            </div>

            <div class="flex flex-col gap-md">
                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-xs text-secondary uppercase">Surface Type</label>
                    <select id="filter-surface" class="bg-surface-container-low text-on-surface font-body-md px-3 py-2 rounded-lg border border-outline-variant outline-none">
                        <option value="ALL">All Surfaces</option>
                        <option value="Asphalt">Asphalt</option>
                        <option value="Concrete">Concrete</option>
                        <option value="Hardwood">Hardwood (Indoor)</option>
                    </select>
                </div>

                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-xs text-secondary uppercase">Rim Type</label>
                    <select id="filter-rim" class="bg-surface-container-low text-on-surface font-body-md px-3 py-2 rounded-lg border border-outline-variant outline-none">
                        <option value="ALL">All Rims</option>
                        <option value="Single Rim">Single Rim</option>
                        <option value="Double Rim">Double Rim</option>
                    </select>
                </div>

                <div class="flex flex-col gap-xs">
                    <label class="font-label-bold text-xs text-secondary uppercase">Night Lighting</label>
                    <select id="filter-lit" class="bg-surface-container-low text-on-surface font-body-md px-3 py-2 rounded-lg border border-outline-variant outline-none">
                        <option value="ALL">All Lighting</option>
                        <option value="Yes">Lit at Night Only</option>
                        <option value="No">No Lights Only</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2 mt-2">
                <button onclick="resetFilters()" class="flex-1 bg-surface-container-high text-on-surface font-label-bold py-3 rounded-lg uppercase">Reset</button>
                <button onclick="applyFilters(); closeFilterModal()" class="flex-1 bg-primary text-on-primary font-headline-md py-3 rounded-lg uppercase">Apply Filters</button>
            </div>
        </div>
    </div>

    <!-- Login Auth Overlay -->
    <div id="login-overlay" class="fixed inset-0 z-[100] bg-background/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center">
        <div class="w-full max-w-sm flex flex-col items-center gap-6 bg-surface-container p-8 rounded-2xl border border-outline-variant/30">
            <img src="logosvg.svg" alt="HoopFinder" class="h-16 w-auto object-contain mb-2">
            <div>
                <h1 class="font-display-lg text-headline-lg text-primary uppercase tracking-wider">HOOPFINDER</h1>
                <p class="font-body-md text-on-surface-variant text-sm mt-1">Authenticate to access court discovery and player networks.</p>
            </div>
            
            <div class="w-full flex flex-col text-left gap-2 mt-2">
                <label class="font-label-bold text-xs text-secondary uppercase tracking-wider">Baller Username</label>
                <input id="username" type="text" placeholder="Enter username..." class="w-full bg-surface-container-low text-on-surface font-body-md px-4 py-3 rounded-xl border border-outline-variant focus:border-primary outline-none transition-colors">
            </div>

            <button class="login-trigger w-full bg-primary text-on-primary font-headline-md text-headline-md uppercase py-3 rounded-xl hover:bg-primary/90 transition-colors flex justify-center items-center gap-2 mt-2">
                <span class="material-symbols-outlined">login</span> Sign In With Google
            </button>

<script>
let allCourtFeatures = [];
let mapMarkers = [];

// Bottom Sheet Logic
const bottomSheet = document.getElementById('bottom-sheet');
const sheetHeader = document.getElementById('sheet-header');
const sheetIcon = document.getElementById('sheet-icon');
const fab = document.getElementById('add-court-fab');
let isSheetExpanded = false;

function toggleSheet() {
    isSheetExpanded = !isSheetExpanded;
    if (isSheetExpanded) {
        bottomSheet.classList.remove('translate-y-[calc(100%-3.5rem)]');
        bottomSheet.classList.add('translate-y-0');
        sheetIcon.classList.add('rotate-180');
        fab.classList.add('opacity-0', 'pointer-events-none');
    } else {
        bottomSheet.classList.add('translate-y-[calc(100%-3.5rem)]');
        bottomSheet.classList.remove('translate-y-0');
        sheetIcon.classList.remove('rotate-180');
        fab.classList.remove('opacity-0', 'pointer-events-none');
    }
}
sheetHeader.addEventListener('click', toggleSheet);

function loginWithGoogle() {
    const usernameInput = document.getElementById('username');
    const username = usernameInput ? usernameInput.value.trim() : '';

    if (!username) {
        alert("Please choose a Baller Username before authenticating with Google.");
        if (usernameInput) usernameInput.focus();
        return;
    }

    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
        .then((result) => {
            document.cookie = `hoopfinder_player_id=${encodeURIComponent(username)}; max-age=86400; path=/`;
            document.cookie = `hoopfinder_username=${encodeURIComponent(username)}; max-age=86400; path=/`;
            document.getElementById('login-overlay').classList.add('hidden');
            if(result.user && result.user.photoURL) {
                document.getElementById('header-user-photo').src = result.user.photoURL;
            }
            fetchCourts();
        })
        .catch((error) => {
            alert("Authentication failed: " + error.message);
        });
}

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.login-trigger').forEach(btn => btn.addEventListener('click', loginWithGoogle));
});

auth.onAuthStateChanged((user) => {
    const overlay = document.getElementById('login-overlay');
    const userPhoto = document.getElementById('header-user-photo');
    if (!user) {
        overlay.classList.remove('hidden');
    } else {
        overlay.classList.add('hidden');
        if (userPhoto && user.photoURL) userPhoto.src = user.photoURL;
        fetchCourts();
    }
});

const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [-75.1652, 39.9526],
    zoom: 13,
    pitch: 45
});

map.on('load', () => {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                map.flyTo({center: [pos.coords.longitude, pos.coords.latitude], zoom: 14});
                setTimeout(fetchCourts, 1000);
            },
            () => fetchCourts()
        );
    } else {
        fetchCourts();
    }
});

async function fetchCourts() {
    if (!auth.currentUser) return;
    const center = map.getCenter();
    try {
        const res = await fetchWithAuth(`${API_BASE_URL}/courts?lat=${center.lat}&lng=${center.lng}&radius=25`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();
        const courts = data.courts || [];
        
        allCourtFeatures = courts.map(c => {
            const lat = c.coordinates ? c.coordinates[1] : (c.lat || 39.9526);
            const lon = c.coordinates ? c.coordinates[0] : (c.lng || -75.1652);
            return {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lon, lat] },
                properties: {
                    id: c.id,
                    name: c.courtName || c.name || 'Proprietary Court',
                    surface: c.surfaceType || c.surface || 'Asphalt',
                    rimType: c.rimType || 'Single Rim',
                    lit: c.lit || 'Yes',
                    imageUrl: c.imageUrl || ''
                }
            };
        });

        applyFilters();
    } catch (e) {
        document.getElementById('courts-list').innerHTML = `<div class="p-4 text-error font-body-md">Unable to load courts from API. (${e.message})</div>`;
    }
}

function applyFilters() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    const surfaceFilter = document.getElementById('filter-surface').value;
    const rimFilter = document.getElementById('filter-rim').value;
    const litFilter = document.getElementById('filter-lit').value;

    const filtered = allCourtFeatures.filter(f => {
        const props = f.properties;
        const matchesQuery = !query || props.name.toLowerCase().includes(query) || props.surface.toLowerCase().includes(query);
        const matchesSurface = surfaceFilter === 'ALL' || props.surface === surfaceFilter;
        const matchesRim = rimFilter === 'ALL' || props.rimType === rimFilter;
        const matchesLit = litFilter === 'ALL' || props.lit === litFilter;

        return matchesQuery && matchesSurface && matchesRim && matchesLit;
    });

    renderMapMarkers(filtered);
    renderBottomSheet(filtered);
}

function renderMapMarkers(features) {
    mapMarkers.forEach(m => m.remove());
    mapMarkers = [];

    features.forEach(f => {
        const props = f.properties;
        const popupHtml = `
            <div class="flex flex-col gap-1 min-w-[140px] pr-2">
                <h3 class="font-headline-md text-primary text-sm uppercase leading-tight">${props.name}</h3>
                <p class="font-body-md text-xs text-on-surface-variant mb-1">${props.surface}</p>
                <a href="court-details.html?id=${props.id}" class="bg-primary text-on-primary text-center rounded py-1 font-label-bold text-[10px] uppercase block w-full">View Court</a>
            </div>
        `;
        const popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupHtml);
        const marker = new maplibregl.Marker({ color: '#ff5722' })
            .setLngLat(f.geometry.coordinates)
            .setPopup(popup)
            .addTo(map);

        mapMarkers.push(marker);
    });
}

function renderBottomSheet(features) {
    const container = document.getElementById('courts-list');
    container.innerHTML = '';
    if (features.length === 0) {
        container.innerHTML = '<div class="p-4 text-on-surface-variant font-body-md">No courts match your search criteria.</div>';
        return;
    }
    
    const center = map.getCenter();
    features.sort((a,b) => {
        const d1 = getDistanceFromLatLonInMi(center.lat, center.lng, a.geometry.coordinates[1], a.geometry.coordinates[0]);
        const d2 = getDistanceFromLatLonInMi(center.lat, center.lng, b.geometry.coordinates[1], b.geometry.coordinates[0]);
        return d1 - d2;
    });

    features.forEach(f => {
        const dist = getDistanceFromLatLonInMi(center.lat, center.lng, f.geometry.coordinates[1], f.geometry.coordinates[0]);
        const props = f.properties;
        
        const imageHeader = props.imageUrl 
            ? `<img src="${props.imageUrl}" class="h-32 w-full object-cover shrink-0">`
            : `<div class="h-32 w-full bg-surface-container-highest flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-4xl text-primary">sports_basketball</span></div>`;
        
        const html = `
        <a href="court-details.html?id=${props.id}" class="min-w-[280px] w-[280px] bg-surface-container rounded-xl overflow-hidden snap-center flex flex-col border border-outline-variant/30 block cursor-pointer hover:border-primary/50 active:scale-[0.98] transition-all">
            <div class="relative">
                ${imageHeader}
                <div class="absolute top-2 right-2 bg-background/90 text-on-surface px-2 py-1 rounded font-label-bold text-xs backdrop-blur-sm border border-outline-variant/30">${dist.toFixed(1)} MI</div>
            </div>
            <div class="p-3 flex flex-col gap-1 border-t border-outline-variant/30">
                <h3 class="font-headline-md text-headline-md-mobile text-primary uppercase truncate" title="${props.name}">${props.name}</h3>
                <div class="flex justify-between items-center mt-1">
                    <span class="font-body-md text-sm text-on-surface-variant flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">layers</span> Surface: ${props.surface}
                    </span>
                </div>
            </div>
        </a>`;
        container.insertAdjacentHTML('beforeend', html);
    });
}

function openFilterModal() { document.getElementById('filter-modal').classList.remove('hidden'); }
function closeFilterModal() { document.getElementById('filter-modal').classList.add('hidden'); }
function resetFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('filter-surface').value = 'ALL';
    document.getElementById('filter-rim').value = 'ALL';
    document.getElementById('filter-lit').value = 'ALL';
    applyFilters();
    closeFilterModal();
}
</script>

<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl border-t border-surface-container-highest">
  <div class="flex justify-around items-center h-16">
    <a aria-current="page" class="flex flex-col items-center justify-center w-16 h-full transition-all text-primary scale-110" href="index.html"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">map</span><span class="font-label-sm text-label-sm">Home</span></a>
    <a class="flex flex-col items-center justify-center w-16 h-full transition-all text-on-surface-variant hover:text-on-surface" href="explore.html"><span class="material-symbols-outlined">explore</span><span class="font-label-sm text-label-sm">Explore</span></a>
    <a class="flex flex-col items-center justify-center w-16 h-full transition-all text-on-surface-variant hover:text-on-surface" href="activity.html"><span class="material-symbols-outlined">sports_basketball</span><span class="font-label-sm text-label-sm">Activity</span></a>
    <a class="flex flex-col items-center justify-center w-16 h-full transition-all text-on-surface-variant hover:text-on-surface" href="profile.html"><span class="material-symbols-outlined">person_outline</span><span class="font-label-sm text-label-sm">Profile</span></a>
  </div>
</nav>
