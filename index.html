};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API_BASE_URL = "https://us-central1-hoopfinder-16cfb.cloudfunctions.net/api";

async function fetchWithAuth(url, options = {}) {
    const user = auth.currentUser;
    if (!user) throw new Error("User not authenticated");
    const token = await user.getIdToken();
    const headers = options.headers || {};
    headers['Authorization'] = `Bearer ${token}`;
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    return fetch(url, options);
}

function getDistanceFromLatLonInMi(lat1, lon1, lat2, lon2) {
    var R = 3958.8;
    var dLat = deg2rad(lat2 - lat1);
    var dLon = deg2rad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
function deg2rad(deg) { return deg * (Math.PI / 180); }

<script>
let allCourtFeatures = [];
let mapMarkers = [];
let userLocationMarker = null;
let isSignUpMode = false; 

// Touch & Drag Gesture Logic for Mobile Sheet
const bottomSheet = document.getElementById('bottom-sheet');
const sheetHeader = document.getElementById('sheet-header');
const sheetIcon = document.getElementById('sheet-icon');
const fab = document.getElementById('add-court-fab');
let isSheetExpanded = false;

function toggleSheet(expand) {
    isSheetExpanded = typeof expand === 'boolean' ? expand : !isSheetExpanded;
    if (isSheetExpanded) {
        bottomSheet.classList.remove('translate-y-[calc(100%-3.5rem)]');
        bottomSheet.classList.add('translate-y-0');
        sheetIcon.classList.add('rotate-180');
        fab.classList.add('opacity-0', 'pointer-events-none');
    } else {
        bottomSheet.classList.add('translate-y-[calc(100%-3.5rem)]');
        bottomSheet.classList.remove('translate-y-0');
        sheetIcon.classList.remove('rotate-180');
        fab.classList.remove('opacity-0', 'pointer-events-none');
    }
}

let startY = 0;
sheetHeader.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY;
}, { passive: true });

sheetHeader.addEventListener('touchend', (e) => {
    const endY = e.changedTouches[0].clientY;
    const diff = startY - endY;
    if (diff > 30) toggleSheet(true);  
    else if (diff < -30) toggleSheet(false); 
    else toggleSheet(); 
});

function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    const usernameContainer = document.getElementById('signup-username-container');
    const title = document.getElementById('auth-title');
    const subtitle = document.getElementById('auth-subtitle');
    const toggleBtn = document.getElementById('auth-toggle-btn');
    const googleText = document.getElementById('google-btn-text');
    const appleText = document.getElementById('apple-btn-text');

    if (isSignUpMode) {
        title.innerText = "CREATE ACCOUNT";
        subtitle.innerText = "Set your username and sign up with Google or Apple.";
        usernameContainer.classList.remove('hidden');
        toggleBtn.innerText = "Already have an account? Sign In";
        googleText.innerText = "Sign Up with Google";
        appleText.innerText = "Sign Up with Apple";
    } else {
        title.innerText = "WELCOME BACK";
        subtitle.innerText = "Sign in to discover courts and view active runs.";
        usernameContainer.classList.add('hidden');
        toggleBtn.innerText = "Need an account? Sign Up";
        googleText.innerText = "Continue with Google";
        appleText.innerText = "Continue with Apple";
    }
}

function setPlayerCookies(username) {
    const cleanHandle = username || 'Baller';
    document.cookie = `hoopfinder_player_id=${encodeURIComponent(cleanHandle)}; max-age=86400; path=/`;
    document.cookie = `hoopfinder_username=${encodeURIComponent(cleanHandle)}; max-age=86400; path=/`;
}

function authenticateWith(providerName) {
    let chosenUsername = '';
    
    if (isSignUpMode) {
        chosenUsername = document.getElementById('signup-username').value.trim();
        if (!chosenUsername) {
            alert("Please choose a Baller Username before creating your account.");
            document.getElementById('signup-username').focus();
            return;
        }
    }

    const provider = providerName === 'apple' 
        ? new firebase.auth.OAuthProvider('apple.com') 
        : new firebase.auth.GoogleAuthProvider();

    auth.signInWithPopup(provider)
        .then(async (result) => {
            const finalUsername = chosenUsername || result.user.displayName || 'Baller';
            
            if (chosenUsername) {
                await result.user.updateProfile({ displayName: chosenUsername });
            }
            
            setPlayerCookies(finalUsername);
            document.getElementById('login-overlay').classList.add('hidden');
            if(result.user && result.user.photoURL) {
                document.getElementById('header-user-photo').src = result.user.photoURL;
            }
            fetchCourts();
        })
        .catch((error) => alert(`${providerName.toUpperCase()} Authentication failed: ${error.message}`));
}

auth.onAuthStateChanged((user) => {
    const overlay = document.getElementById('login-overlay');
    const userPhoto = document.getElementById('header-user-photo');
    if (!user) {
        overlay.classList.remove('hidden');
    } else {
        overlay.classList.add('hidden');
        if (userPhoto && user.photoURL) userPhoto.src = user.photoURL;
        fetchCourts();
    }
});

const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [-75.1652, 39.9526],
    zoom: 13,
    pitch: 45
});

function renderUserLocationMarker(lng, lat) {
    if (userLocationMarker) {
        userLocationMarker.setLngLat([lng, lat]);
        return;
    }

    const el = document.createElement('div');
    el.className = 'user-location-marker';
    
    const dot = document.createElement('div');
    dot.className = 'user-location-dot';
    
    const pulse = document.createElement('div');
    pulse.className = 'user-location-pulse';

    el.appendChild(dot);
    el.appendChild(pulse);

    const userPopup = new maplibregl.Popup({ offset: 15 }).setHTML(`
        <div class="font-label-bold text-xs text-primary uppercase text-center">Your Current Location</div>
    `);

    userLocationMarker = new maplibregl.Marker({ element: el })
        .setLngLat([lng, lat])
        .setPopup(userPopup)
        .addTo(map);
}

map.on('load', () => {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { longitude, latitude } = pos.coords;
                renderUserLocationMarker(longitude, latitude);
                map.flyTo({center: [longitude, latitude], zoom: 14});
                setTimeout(fetchCourts, 1000);
            },
            () => fetchCourts()
        );

        navigator.geolocation.watchPosition(
            (pos) => renderUserLocationMarker(pos.coords.longitude, pos.coords.latitude),
            null,
            { enableHighAccuracy: true }
        );
    } else {
        fetchCourts();
    }
});

async function fetchCourts() {
    if (!auth.currentUser) return;
    const center = map.getCenter();
    try {
        const res = await fetchWithAuth(`${API_BASE_URL}/courts?lat=${center.lat}&lng=${center.lng}&radius=25`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();
        const courts = data.courts || [];
        
        allCourtFeatures = courts.map(c => {
            const lat = c.coordinates ? c.coordinates[1] : (c.lat || 39.9526);
            const lon = c.coordinates ? c.coordinates[0] : (c.lng || -75.1652);
            return {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lon, lat] },
                properties: {
                    id: c.id,
                    name: c.courtName || c.name || 'Proprietary Court',
                    surface: c.surfaceType || c.surface || 'Asphalt',
                    rimType: c.rimType || 'Single Rim',
                    lit: c.lit || 'Yes',
                    imageUrl: c.imageUrl || ''
                }
            };
        });

        applyFilters();
    } catch (e) {
        document.getElementById('courts-list').innerHTML = `<div class="p-4 text-error font-body-md">Unable to load courts from API. (${e.message})</div>`;
    }
}

function applyFilters() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    const surfaceFilter = document.getElementById('filter-surface').value;
    const rimFilter = document.getElementById('filter-rim').value;
    const litFilter = document.getElementById('filter-lit').value;

    const filtered = allCourtFeatures.filter(f => {
        const props = f.properties;
        const matchesQuery = !query || props.name.toLowerCase().includes(query) || props.surface.toLowerCase().includes(query);
        const matchesSurface = surfaceFilter === 'ALL' || props.surface === surfaceFilter;
        const matchesRim = rimFilter === 'ALL' || props.rimType === rimFilter;
        const matchesLit = litFilter === 'ALL' || props.lit === litFilter;

        return matchesQuery && matchesSurface && matchesRim && matchesLit;
    });

    renderMapMarkers(filtered);
    renderBottomSheet(filtered);
}

function renderMapMarkers(features) {
    mapMarkers.forEach(m => m.remove());
    mapMarkers = [];

    features.forEach(f => {
        const props = f.properties;
        const popupHtml = `
            <div class="flex flex-col gap-1 min-w-[140px] pr-2">
                <h3 class="font-headline-md text-primary text-sm uppercase leading-tight">${props.name}</h3>
                <p class="font-body-md text-xs text-on-surface-variant mb-1">${props.surface}</p>
                <a href="court-details.html?id=${props.id}" class="bg-primary text-on-primary text-center rounded py-1 font-label-bold text-[10px] uppercase block w-full">View Court</a>
            </div>
        `;
        const popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupHtml);
        const marker = new maplibregl.Marker({ color: '#ff5722' })
            .setLngLat(f.geometry.coordinates)
            .setPopup(popup)
            .addTo(map);

        mapMarkers.push(marker);
    });
}

function renderBottomSheet(features) {
    const container = document.getElementById('courts-list');
    container.innerHTML = '';
    if (features.length === 0) {
        container.innerHTML = '<div class="p-4 text-on-surface-variant font-body-md">No courts match your search criteria.</div>';
        return;
    }
    
    const center = map.getCenter();
    features.sort((a,b) => {
        const d1 = getDistanceFromLatLonInMi(center.lat, center.lng, a.geometry.coordinates[1], a.geometry.coordinates[0]);
        const d2 = getDistanceFromLatLonInMi(center.lat, center.lng, b.geometry.coordinates[1], b.geometry.coordinates[0]);
        return d1 - d2;
    });

    features.forEach(f => {
        const dist = getDistanceFromLatLonInMi(center.lat, center.lng, f.geometry.coordinates[1], f.geometry.coordinates[0]);
        const props = f.properties;
        
        const imageHeader = props.imageUrl 
            ? `<img src="${props.imageUrl}" class="h-32 w-full object-cover shrink-0">`
            : `<div class="h-32 w-full bg-surface-container-highest flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-4xl text-primary">sports_basketball</span></div>`;
        
        const html = `
        <a href="court-details.html?id=${props.id}" class="min-w-[280px] w-[280px] bg-surface-container rounded-xl overflow-hidden snap-center flex flex-col border border-outline-variant/30 block cursor-pointer hover:border-primary/50 active:scale-[0.98] transition-all">
            <div class="relative">
                ${imageHeader}
                <div class="absolute top-2 right-2 bg-background/90 text-on-surface px-2 py-1 rounded font-label-bold text-xs backdrop-blur-sm border border-outline-variant/30">${dist.toFixed(1)} MI</div>
            </div>
            <div class="p-3 flex flex-col gap-1 border-t border-outline-variant/30">
                <h3 class="font-headline-md text-headline-md-mobile text-primary uppercase truncate" title="${props.name}">${props.name}</h3>
                <div class="flex justify-between items-center mt-1">
                    <span class="font-body-md text-sm text-on-surface-variant flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">layers</span> Surface: ${props.surface}
                    </span>
                </div>
            </div>
        </a>`;
        container.insertAdjacentHTML('beforeend', html);
    });
}

function openFilterModal() { document.getElementById('filter-modal').classList.remove('hidden'); }
function closeFilterModal() { document.getElementById('filter-modal').classList.add('hidden'); }
function resetFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('filter-surface').value = 'ALL';
    document.getElementById('filter-rim').value = 'ALL';
    document.getElementById('filter-lit').value = 'ALL';
    applyFilters();
    closeFilterModal();
}
</script>
