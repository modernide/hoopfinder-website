<script>
const firebaseConfig = {
    apiKey: "AIzaSyCBNML0EM1RL0EiUK5S5Fi27JU3niH0rTI",
    authDomain: "hoopfinder-16cfb.firebaseapp.com",
    projectId: "hoopfinder-16cfb",
    storageBucket: "hoopfinder-16cfb.firebasestorage.app",
    messagingSenderId: "965894675612",
    appId: "1:965894675612:web:226601b3e3bca26fb52159",
    measurementId: "G-4BTW498XNP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API_BASE_URL = "https://us-central1-hoopfinder-16cfb.cloudfunctions.net/api";

async function fetchWithAuth(url, options = {}) {
    const user = auth.currentUser;
    if (!user) throw new Error("User not authenticated");
    const token = await user.getIdToken();
    const headers = options.headers || {};
    headers['Authorization'] = `Bearer ${token}`;
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    return fetch(url, options);
}

function getDistanceFromLatLonInMi(lat1, lon1, lat2, lon2) {
    var R = 3958.8;
    var dLat = deg2rad(lat2 - lat1);
    var dLon = deg2rad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
function deg2rad(deg) { return deg * (Math.PI / 180); }
</script>

<script>
function loginWithGoogle() {
    const usernameInput = document.getElementById('username');
    const username = usernameInput ? usernameInput.value.trim() : '';

    if (!username) {
        alert("Please choose a Baller Username before authenticating with Google.");
        if (usernameInput) usernameInput.focus();
        return;
    }

    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
        .then((result) => {
            document.cookie = `hoopfinder_player_id=${encodeURIComponent(username)}; max-age=86400; path=/`;
            document.cookie = `hoopfinder_username=${encodeURIComponent(username)}; max-age=86400; path=/`;
            document.getElementById('login-overlay').classList.add('hidden');
            if(result.user && result.user.photoURL) {
                document.getElementById('header-user-photo').src = result.user.photoURL;
            }
            fetchCourts();
        })
        .catch((error) => {
            console.error("Auth error:", error);
            alert("Authentication failed: " + error.message);
        });
}

document.addEventListener('DOMContentLoaded', () => {
    const triggers = document.querySelectorAll('.login-trigger');
    triggers.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            loginWithGoogle();
        });
    });
});

auth.onAuthStateChanged((user) => {
    const overlay = document.getElementById('login-overlay');
    const userPhoto = document.getElementById('header-user-photo');
    if (!user) {
        overlay.classList.remove('hidden');
    } else {
        overlay.classList.add('hidden');
        if (userPhoto && user.photoURL) {
            userPhoto.src = user.photoURL;
        }
        fetchCourts();
    }
});

const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [-75.1652, 39.9526],
    zoom: 13,
    pitch: 45
});

let mapMarkers = [];

map.on('load', () => {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                map.flyTo({center: [pos.coords.longitude, pos.coords.latitude], zoom: 14});
                setTimeout(fetchCourts, 1000);
            },
            (err) => { console.warn("Geoloc failed", err); fetchCourts(); }
        );
    } else {
        fetchCourts();
    }
});

let debounceTimer;
map.on('moveend', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fetchCourts, 800);
});

async function fetchCourts() {
    if (!auth.currentUser) return;
    const center = map.getCenter();
    try {
        const res = await fetchWithAuth(`${API_BASE_URL}/courts?lat=${center.lat}&lng=${center.lng}&radius=25`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();
        const courts = data.courts || [];
        
        // Remove old markers
        mapMarkers.forEach(marker => marker.remove());
        mapMarkers = [];

        const features = courts.map(c => {
            const lat = c.coordinates ? c.coordinates[1] : (c.lat || 39.9526);
            const lon = c.coordinates ? c.coordinates[0] : (c.lng || -75.1652);
            const name = c.courtName || c.name || 'Proprietary HoopFinder Court';
            const surface = c.surfaceType || c.surface || 'Asphalt';
            const id = c.id;

            // Create a native MapLibre Marker and Popup
            const popupHtml = `
                <div class="flex flex-col gap-1 min-w-[140px] pr-2">
                    <h3 class="font-headline-md text-primary text-sm uppercase leading-tight">${name}</h3>
                    <p class="font-body-md text-xs text-on-surface-variant mb-1">${surface}</p>
                    <a href="court-details.html?id=${id}" class="bg-primary text-on-primary text-center rounded py-1 font-label-bold text-[10px] uppercase block w-full hover:bg-primary/80">View Court</a>
                </div>
            `;
            const popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupHtml);

            const marker = new maplibregl.Marker({ color: '#ff5722' })
                .setLngLat([lon, lat])
                .setPopup(popup)
                .addTo(map);

            mapMarkers.push(marker);

            return {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lon, lat] },
                properties: {
                    id: c.id,
                    name: name,
                    surface: surface,
                    hoops: c.hoops || c.courtCount || '1 Court',
                    lit: c.lit || 'Yes',
                    imageUrl: c.imageUrl || ''
                }
            };
        });
        
        renderBottomSheet(features);
    } catch (e) {
        console.error('Error fetching proprietary court data:', e);
        document.getElementById('courts-list').innerHTML = `<div class="p-4 text-error font-body-md">Unable to load courts from API. (${e.message})</div>`;
    }
}

function renderBottomSheet(features) {
    const container = document.getElementById('courts-list');
    container.innerHTML = '';
    if (features.length === 0) {
        container.innerHTML = '<div class="p-4 text-on-surface-variant font-body-md">No HoopFinder courts found in this area. Move map or add a court.</div>';
        return;
    }
    
    const center = map.getCenter();
    features.sort((a,b) => {
        const d1 = getDistanceFromLatLonInMi(center.lat, center.lng, a.geometry.coordinates[1], a.geometry.coordinates[0]);
        const d2 = getDistanceFromLatLonInMi(center.lat, center.lng, b.geometry.coordinates[1], b.geometry.coordinates[0]);
        return d1 - d2;
    });

    features.forEach(f => {
        const dist = getDistanceFromLatLonInMi(center.lat, center.lng, f.geometry.coordinates[1], f.geometry.coordinates[0]);
        const props = f.properties;
        
        const imageHeader = props.imageUrl 
            ? `<img src="${props.imageUrl}" class="h-32 w-full object-cover">`
            : `<div class="h-32 w-full bg-surface-container-highest flex items-center justify-center"><span class="material-symbols-outlined text-4xl text-primary">sports_basketball</span></div>`;
        
        const html = `
        <a href="court-details.html?id=${props.id}" class="min-w-[280px] w-[280px] bg-surface-container rounded-xl overflow-hidden snap-center flex flex-col border border-outline-variant/30 block cursor-pointer hover:border-primary/50 active:scale-[0.98] transition-all">
            <div class="relative">
                ${imageHeader}
                <div class="absolute top-2 right-2 bg-background/90 text-on-surface px-2 py-1 rounded font-label-bold text-xs backdrop-blur-sm border border-outline-variant/30">${dist.toFixed(1)} MI</div>
            </div>
            <div class="p-3 flex flex-col gap-1 border-t border-outline-variant/30">
                <h3 class="font-headline-md text-headline-md-mobile text-primary uppercase truncate" title="${props.name}">${props.name}</h3>
                <div class="flex justify-between items-center mt-1">
                    <span class="font-body-md text-sm text-on-surface-variant flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">layers</span>
                        Surface: ${props.surface}
                    </span>
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <span class="font-label-bold text-xs text-on-surface bg-surface-variant px-2 py-0.5 rounded-sm border border-outline-variant/20">LIT: ${String(props.lit).toUpperCase()}</span>
                    <span class="font-label-bold text-[10px] text-primary bg-primary/10 px-2 py-0.5 rounded-sm uppercase border border-primary/20">VERIFIED HOOPFINDER</span>
                </div>
            </div>
        </a>`;
        container.insertAdjacentHTML('beforeend', html);
    });
}
</script>
