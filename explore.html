        function getDistanceFromLatLonInMi(lat1, lon1, lat2, lon2) {
            var R = 3958.8;
            var dLat = deg2rad(lat2 - lat1);
            var dLon = deg2rad(lon2 - lon1);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
        function deg2rad(deg) {return deg * (Math.PI / 180);}
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return null;
        }

    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "./index.html";
            } else {
                console.log("Welcome, " + user.displayName);
                const userPhoto = document.getElementById('header-user-photo');
                if (userPhoto && user.photoURL) {
                    userPhoto.src = user.photoURL;
                }
                if (typeof onAuthReady === 'function') {
                    onAuthReady(user);
                }
            }
        });
    </script>

    <script>
        function onAuthReady(user) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchLocalCourts(pos.coords.latitude, pos.coords.longitude),
                    (err) => fetchLocalCourts(39.9526, -75.1652)
                );
            } else {
                fetchLocalCourts(39.9526, -75.1652);
            }
        }

        async function fetchLocalCourts(lat, lon) {
            const offset = 0.05;
            const bbox = `${lat - offset},${lon - offset},${lat + offset},${lon + offset}`;
            const query = `[out:json][timeout:25];nwr["leisure"="pitch"]["sport"="basketball"](${bbox});out center;`;

            try {
                const response = await fetch(`https://overpass-api.de/api/interpreter`, {method: 'POST', body: `data=${encodeURIComponent(query)}`});
                const data = await response.json();

                const listContainer = document.getElementById('explore-list');
                listContainer.innerHTML = '';

                if (data.elements.length === 0) {
                    listContainer.innerHTML = '<p class="text-on-surface-variant font-body-md text-center">No courts found nearby.</p>';
                    return;
                }

                data.elements.sort((a, b) => {
                    const alat = a.lat || a.center.lat; const alon = a.lon || a.center.lon;
                    const blat = b.lat || b.center.lat; const blon = b.lon || b.center.lon;
                    return getDistanceFromLatLonInMi(lat, lon, alat, alon) - getDistanceFromLatLonInMi(lat, lon, blat, blon);
                });

                data.elements.forEach(el => {
                    const clat = el.lat || el.center.lat;
                    const clon = el.lon || el.center.lon;
                    const dist = getDistanceFromLatLonInMi(lat, lon, clat, clon);
                    const name = el.tags.name || `Court ${el.id}`;
                    const surface = el.tags.surface || 'Unknown Surface';

                    const html = `
                <a href="court-details.html?id=${el.id}&type=${el.type}" class="w-full block bg-surface-container rounded-xl overflow-hidden shadow-lg border border-outline-variant/30 flex flex-col cursor-pointer hover:shadow-xl transition-shadow active:scale-[0.98]">
                    <div class="p-md flex flex-col gap-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-headline-md text-headline-md text-on-surface">${name}</h3>
                                <p class="font-body-md text-body-md text-on-surface-variant font-label-sm">${surface.toUpperCase()} • ${dist.toFixed(1)} mi</p>
                            </div>
                            <div class="flex flex-col items-end">
                                <span class="bg-primary/20 text-primary px-2 py-1 rounded font-label-bold text-[10px] uppercase shadow-sm">OSM VERIFIED</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 mt-2 pt-2 border-t border-outline-variant/20">
                            <span class="material-symbols-outlined text-[16px] text-tertiary">open_in_new</span>
                            <span class="font-label-sm text-[12px] text-tertiary">View Live Details</span>
                        </div>
                    </div>
                </a>`;
                    listContainer.insertAdjacentHTML('beforeend', html);
                });
            } catch (e) {
                document.getElementById('explore-list').innerHTML = '<p class="text-error font-body-md text-center">Failed to load API data.</p>';
            }
        }
    </script>
