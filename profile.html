<script>
const firebaseConfig = {
    apiKey: "AIzaSyCBNML0EM1RL0EiUK5S5Fi27JU3niH0rTI",
    authDomain: "hoopfinder-16cfb.firebaseapp.com",
    projectId: "hoopfinder-16cfb",
    storageBucket: "hoopfinder-16cfb.firebasestorage.app",
    messagingSenderId: "965894675612",
    appId: "1:965894675612:web:226601b3e3bca26fb52159",
    measurementId: "G-4BTW498XNP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API_BASE_URL = "https://us-central1-hoopfinder-16cfb.cloudfunctions.net/api";

async function fetchWithAuth(url, options = {}) {
    const user = auth.currentUser;
    if (!user) throw new Error("User not authenticated");
    const token = await user.getIdToken();
    const headers = options.headers || {};
    headers['Authorization'] = `Bearer ${token}`;
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    return fetch(url, options);
}

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
    return null;
}
</script>

<script>
auth.onAuthStateChanged((user) => {
    if (!user) {
        window.location.href = "./index.html"; 
    } else {
        const userPhoto = document.getElementById('header-user-photo');
        if (userPhoto && user.photoURL) {
            userPhoto.src = user.photoURL;
        }
        onAuthReady(user);
    }
});

function onAuthReady(user) {
    const username = getCookie('hoopfinder_player_id') || getCookie('hoopfinder_username') || user.displayName || 'Baller';
    
    document.getElementById('user-profile-name').innerText = user.displayName || username;
    document.getElementById('user-profile-handle').innerText = '@' + username.toLowerCase().replace(/\s+/g, '_');
    document.getElementById('user-profile-email').innerText = user.email || '';
    
    if (user.photoURL) {
        document.getElementById('user-profile-avatar').src = user.photoURL;
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
        auth.signOut().then(() => {
            window.location.href = "./index.html";
        });
    });

    // Fetch user stats (check-ins, saved courts, rep)
    loadUserStats();
}

async function loadUserStats() {
    try {
        const res = await fetchWithAuth(`${API_BASE_URL}/user-stats`);
        if (res.ok) {
            const data = await res.json();
            document.getElementById('user-checkins-count').innerText = data.checkIns || 0;
            document.getElementById('saved-courts-count').innerText = data.savedCourts || 0;
            document.getElementById('user-rep-count').innerText = data.rep || 100;
        }
    } catch (e) {
        console.error("Failed to load user stats:", e);
    }
}

let savedCourtsLoaded = false;

async function toggleSavedCourtsList() {
    const container = document.getElementById('saved-courts-container');
    const chevron = document.getElementById('saved-chevron');
    
    if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        container.classList.add('flex');
        chevron.classList.add('rotate-180');
        if (!savedCourtsLoaded) loadSavedCourts();
    } else {
        container.classList.add('hidden');
        container.classList.remove('flex');
        chevron.classList.remove('rotate-180');
    }
}

async function loadSavedCourts() {
    const container = document.getElementById('saved-courts-container');
    container.innerHTML = `<div class="p-6 text-center font-label-bold text-xs text-on-surface-variant flex items-center justify-center gap-2"><span class="material-symbols-outlined animate-spin text-primary">sync</span> Syncing saved courts...</div>`;

    try {
        const res = await fetchWithAuth(`${API_BASE_URL}/saved-courts`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        container.innerHTML = '';
        const courts = data.courts || [];

        const countElem = document.getElementById('saved-courts-count');
        if (countElem) countElem.innerText = courts.length;

        if (courts.length === 0) {
            container.innerHTML = `
            <div class="p-6 flex flex-col items-center text-center gap-2">
                <span class="material-symbols-outlined text-3xl text-secondary">bookmark_border</span>
                <span class="font-headline-md text-on-surface uppercase text-sm">No Saved Courts</span>
                <p class="font-body-md text-xs text-on-surface-variant">Tap save on any court page to pin your favorite runs here.</p>
            </div>`;
            return;
        }

        courts.forEach((c, index) => {
            const name = c.courtName || c.name || 'Proprietary Court';
            const surface = c.surfaceType || c.surface || 'Asphalt';
            const rating = c.rating ? parseFloat(c.rating).toFixed(1) : '4.5';
            const imageHeader = c.imageUrl 
                ? `<img src="${c.imageUrl}" class="w-12 h-12 rounded-lg object-cover border border-outline-variant/30 shrink-0">`
                : `<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center shrink-0 border border-outline-variant/30"><span class="material-symbols-outlined text-primary text-lg">sports_basketball</span></div>`;

            const borderClass = index !== courts.length - 1 ? 'border-b border-outline-variant/15' : '';

            const html = `
            <a href="court-details.html?id=${c.id}" class="p-3 ${borderClass} hover:bg-surface-container-high/80 flex items-center justify-between gap-md transition-colors group">
                <div class="flex items-center gap-md truncate">
                    ${imageHeader}
                    <div class="flex flex-col truncate">
                        <span class="font-headline-md text-sm text-on-surface uppercase truncate group-hover:text-primary transition-colors">${name}</span>
                        <div class="flex items-center gap-xs mt-0.5">
                            <span class="font-label-sm text-[10px] text-tertiary uppercase">${surface}</span>
                            <span class="text-tertiary text-[10px]">•</span>
                            <span class="font-label-bold text-[10px] text-primary flex items-center gap-0.5">
                                ★ ${rating}
                            </span>
                        </div>
                    </div>
                </div>
                <span class="material-symbols-outlined text-tertiary group-hover:text-primary text-sm transition-colors pr-1">chevron_right</span>
            </a>`;
            container.insertAdjacentHTML('beforeend', html);
        });
        savedCourtsLoaded = true;
    } catch (e) {
        container.innerHTML = `<div class="p-4 text-xs text-error text-center font-body-md">Failed to load saved courts.</div>`;
    }
}
</script>
