        function getDistanceFromLatLonInMi(lat1, lon1, lat2, lon2) {
            var R = 3958.8;
            var dLat = deg2rad(lat2 - lat1);
            var dLon = deg2rad(lon2 - lon1);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
        function deg2rad(deg) {return deg * (Math.PI / 180);}
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return null;
        }

    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "./index.html";
            } else {
                console.log("Welcome, " + user.displayName);
                const userPhoto = document.getElementById('header-user-photo');
                if (userPhoto && user.photoURL) {
                    userPhoto.src = user.photoURL;
                }
                if (typeof onAuthReady === 'function') {
                    onAuthReady(user);
                }
            }
        });
    </script>

    <script>
        function onAuthReady(user) {
            const username = getCookie('hexadune_player_id') || getCookie('hoopspot_username') || user.displayName || 'Baller';

            document.getElementById('user-profile-name').innerText = user.displayName || username;
            document.getElementById('user-profile-handle').innerText = '@' + username.toLowerCase().replace(/\s+/g, '_');
            document.getElementById('user-profile-email').innerText = user.email || '';

            if (user.photoURL) {
                document.getElementById('user-profile-avatar').src = user.photoURL;
            }

            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.signOut().then(() => {
                    window.location.href = "./index.html";
                });
            });
        }
