<style>
@layer base { body { @apply bg-background text-on-background antialiased; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } }
::-webkit-scrollbar { display: none; }
</style>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyCBNML0EM1RL0EiUK5S5Fi27JU3niH0rTI",
    authDomain: "hoopfinder-16cfb.firebaseapp.com",
    projectId: "hoopfinder-16cfb",
    storageBucket: "hoopfinder-16cfb.firebasestorage.app",
    messagingSenderId: "965894675612",
    appId: "1:965894675612:web:226601b3e3bca26fb52159",
    measurementId: "G-4BTW498XNP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const API_BASE_URL = "https://us-central1-hoopfinder-16cfb.cloudfunctions.net/api";

async function fetchWithAuth(url, options = {}) {
    const user = auth.currentUser;
    if (!user) throw new Error("User not authenticated");
    const token = await user.getIdToken();
    const headers = options.headers || {};
    headers['Authorization'] = `Bearer ${token}`;
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    return fetch(url, options);
}

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
    return null;
}
</script>
</head>
<body class="min-h-screen flex flex-col">
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.4)] pointer-events-auto">

      <span class="font-headline-md text-headline-md text-primary uppercase truncate">Activity</span>
    </div>
    <a href="profile.html">
      <img id="header-user-photo" alt="Profile" class="w-10 h-10 rounded-full object-cover ring-2 ring-outline/20 bg-surface-container-highest" src="logosvg.svg">
    </a>
  </div>
</header>

<main class="flex-grow w-full pt-16 pb-24 bg-background">
  <div class="px-margin-mobile pt-md flex flex-col gap-md">
      <div class="flex justify-between items-end border-b border-surface-container-highest pb-2 mb-2">
          <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Live Feed</h2>
          <button onclick="loadActivityFeed()" class="font-label-bold text-label-bold text-primary uppercase hover:underline">Refresh</button>
      </div>

      <div id="activity-feed-container" class="flex flex-col gap-md">
          <div class="text-center p-xl flex flex-col items-center justify-center">
              <span class="material-symbols-outlined animate-spin text-primary text-4xl mb-4">sync</span>
              <p class="font-body-md text-on-surface-variant">Syncing live check-ins from HoopFinder Network...</p>
          </div>
      </div>
  </div>
</main>

<script>
auth.onAuthStateChanged((user) => {
    if (!user) {
        window.location.href = "./index.html"; 
    } else {
        const userPhoto = document.getElementById('header-user-photo');
        if (userPhoto && user.photoURL) {
            userPhoto.src = user.photoURL;
        }
        loadActivityFeed(user);
    }
});

function timeAgo(dateString) {
    if (!dateString) return 'Recently';
    const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
    if (seconds < 60) return 'Just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    return `${Math.floor(hours / 24)}d ago`;
}

async function loadActivityFeed(user) {
    const container = document.getElementById('activity-feed-container');
    const currentUser = user || auth.currentUser;
    const username = getCookie('hoopfinder_player_id') || getCookie('hoopfinder_username') || (currentUser ? currentUser.displayName : 'Baller');

    try {
        const res = await fetchWithAuth(`${API_BASE_URL}/activity`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        container.innerHTML = '';
        const activities = data.activities || [];

        if (activities.length === 0) {
            container.innerHTML = `
                <div class="bg-surface-container rounded-xl p-md shadow-lg border border-outline-variant/30 flex flex-col items-center text-center gap-sm py-8">
                    <span class="material-symbols-outlined text-4xl text-primary">sports_basketball</span>
                    <h3 class="font-headline-md text-on-surface uppercase">No Check-ins Yet</h3>
                    <p class="font-body-md text-xs text-on-surface-variant">Be the first to check into a local park to update players on court conditions!</p>
                    <a href="index.html" class="mt-2 bg-primary text-on-primary font-label-bold text-xs uppercase px-4 py-2 rounded-lg">Find Courts Near You</a>
                </div>`;
            return;
        }

        activities.forEach(item => {
            const userName = item.user || item.username || 'Baller';
            const initials = userName.substring(0, 2).toUpperCase();
            const message = item.message || 'Checked into court';
            const timestamp = timeAgo(item.createdAt || item.timestamp);
            const userPhoto = item.photoURL;

            const avatarHtml = userPhoto 
                ? `<img src="${userPhoto}" class="w-10 h-10 rounded-full object-cover border border-primary/30">`
                : `<div class="w-10 h-10 rounded-full bg-primary/20 text-primary border border-primary/30 flex items-center justify-center font-headline-md">${initials}</div>`;

            const html = `
            <div class="bg-surface-container rounded-xl p-md shadow-lg border border-outline-variant/30 flex flex-col gap-sm active:scale-[0.99] transition-transform">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-sm">
                        ${avatarHtml}
                        <div class="flex flex-col">
                            <span class="font-label-bold text-label-bold text-on-surface">${userName}</span>
                            <span class="font-label-sm text-label-sm text-tertiary">${timestamp}</span>
                        </div>
                    </div>
                    <span class="bg-primary/10 text-primary px-2 py-0.5 rounded font-label-bold text-[10px] uppercase border border-primary/20">LIVE</span>
                </div>
                <p class="font-body-md text-body-md text-on-surface-variant">${message}</p>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        });

    } catch (e) {
        console.error("Activity API error:", e);
        container.innerHTML = `
            <div class="bg-surface-container rounded-xl p-md border border-outline-variant/30 flex flex-col gap-sm">
                <div class="flex items-center gap-sm">
                    <img src="${currentUser && currentUser.photoURL ? currentUser.photoURL : 'logosvg.svg'}" class="w-10 h-10 rounded-full object-cover">
                    <div class="flex flex-col">
                        <span class="font-label-bold text-label-bold text-on-surface">${username}</span>
                        <span class="font-label-sm text-label-sm text-tertiary">Just Now</span>
                    </div>
                </div>
                <p class="font-body-md text-body-md text-on-surface-variant">Connected to HoopFinder Network. Check into any court on the map to share live run statuses.</p>
            </div>`;
    }
}
</script>
